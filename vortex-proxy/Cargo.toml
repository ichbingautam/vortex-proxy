[package]
name = "vortex-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Async processing engine for Vortex"

[dependencies]
vortex-core = { path = "../vortex-core" }
vortex-filters = { path = "../vortex-filters" }
vortex-admin = { path = "../vortex-admin" }
tokio = { version = "1.0", features = ["full"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
pki-types = { package = "rustls-pki-types", version = "1.10" }
crossbeam-queue = "0.3"
dashmap = "6.0"

# Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.22"
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry_sdk = { version = "0.21", features = ["tokio", "rt-tokio"] }
opentelemetry-otlp = { version = "0.14", features = ["trace", "grpc-tonic", "tokio"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

[dev-dependencies]
reqwest = "0.12"
tokio = { version = "1.0", features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
